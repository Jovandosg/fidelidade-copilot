services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fidelidade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fidelidade}
      POSTGRES_USER: ${POSTGRES_USER:-fidelidade_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?defina POSTGRES_API_PASSWORD no .env}
      POSTGRES_ETL_PASSWORD: ${POSTGRES_ETL_PASSWORD:?defina POSTGRES_ETL_PASSWORD no .env}
      POSTGRES_AUDIT_PASSWORD: ${POSTGRES_AUDIT_PASSWORD:?defina POSTGRES_AUDIT_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
